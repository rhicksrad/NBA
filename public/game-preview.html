<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game preview | NBA Intelligence Hub</title>
    <meta name="description" content="A tale of the tape for an upcoming NBA game: win chance, power index, records, last ten games, leading scorers and the injury report for both teams." />
    <meta property="og:site_name" content="NBA Intelligence Hub" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Game preview | NBA Intelligence Hub" />
    <meta property="og:description" content="Win chance, power index, form, scorers and injuries for both teams." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="assets/logos/nba-logoman.svg" />
    <link rel="preload" href="assets/fonts/bigshoulders-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="data/live/league.json" as="fetch" crossorigin />
    <link rel="stylesheet" href="styles/court.css" />
    <link rel="stylesheet" href="styles/game-preview.css" />
  </head>
  <body>
    <header class="table">
      <div class="table__inner">
        <a class="table__brand" href="index.html">
          <img src="assets/logos/nba-logoman.svg" alt="" width="14" height="30" />
          <span>Intelligence Hub</span>
        </a>
        <nav class="table__nav" aria-label="Sections">
          <a href="index.html">Tonight</a>
          <a href="games.html" aria-current="page">Games</a>
          <a href="players.html">Players</a>
          <a href="teams.html">Teams</a>
          <a href="goat.html">GOAT Index</a>
          <a href="history.html">History</a>
          <a href="insights.html">Insights Lab</a>
          <a href="rewind.html">Rewind</a>
          <a href="about.html">About</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="tape-board">
        <div class="tape-board__inner">
          <a class="tape-board__back" href="games.html">&larr; Games</a>
          <h1 data-title>Game preview</h1>
          <p class="tape-board__when" data-when></p>
          <a class="tape-board__started" data-started hidden></a>
          <div class="tape-board__sides">
            <div class="tape-side" data-side="away"></div>
            <span class="tape-board__at">AT</span>
            <div class="tape-side tape-side--home" data-side="home"></div>
          </div>
          <div class="tape-board__odds" data-odds role="img"></div>
        </div>
      </section>

      <div class="site-frame preview" data-body>
        <section data-tape-section aria-labelledby="tape-title">
          <header class="sheet-head">
            <h2 id="tape-title">Tale of the tape</h2>
            <p data-tape-note></p>
          </header>
          <table class="sheet tape">
            <thead>
              <tr>
                <th scope="col" data-tape-away>Away</th>
                <th scope="col"><span class="visually-hidden">Measure</span></th>
                <th scope="col" data-tape-home>Home</th>
              </tr>
            </thead>
            <tbody data-tape></tbody>
          </table>
        </section>

        <div class="team-cols">
          <section class="team-col" data-team="away"></section>
          <section class="team-col" data-team="home"></section>
        </div>

        <footer class="site-footer">
          <span data-stamp>Records, form, averages and injuries from ESPN's public feeds.</span>
          <span>Not affiliated with the NBA. <a href="about.html">How this works</a></span>
        </footer>
      </div>
    </main>
    <script type="module" src="scripts/game-preview.js"></script>
  </body>
</html>
