name: CI

# PR gate. Same-repo PRs run on Ryan's self-hosted web runners when the repo
# variable CI_RUNNER is "local"; fork PRs (and everything, when the variable is
# unset) run on GitHub-hosted runners. See docs/CI.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate (tests + integrity)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER == 'local' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","web-trusted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          # Every web runner on a PC shares one home, so the default ~/setup-pnpm
          # is raced by jobs from other repos. Install pnpm per job instead.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # The PCs keep one shared pnpm store on disk; only hosted runners need GitHub's cache.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Static integrity (links, JSON, weight budgets)
        run: pnpm check:site
      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdx

  python:
    name: Python (ruff + pytest)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER == 'local' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","web-trusted","python"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # setup-python ships Ubuntu builds and can refuse other distros, so the PCs use uv instead.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install (hosted)
        if: runner.environment == 'github-hosted'
        run: pip install -r requirements-dev.txt
      - name: Install (self-hosted, uv)
        if: runner.environment == 'self-hosted'
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: pytest
      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdx

  smoke:
    name: Browser smoke (every page, phone + desktop)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER == 'local' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","web-trusted","playwright"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          # Every web runner on a PC shares one home, so the default ~/setup-pnpm
          # is raced by jobs from other repos. Install pnpm per job instead.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # The PCs already have Chromium's system libraries and share one browser
      # folder (PLAYWRIGHT_BROWSERS_PATH); only hosted runners need --with-deps.
      - name: Chromium (hosted)
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright install --with-deps chromium
      - name: Chromium (self-hosted)
        if: runner.environment == 'self-hosted'
        run: pnpm exec playwright install chromium
      # Loads every page offline at two widths, then replays a recorded ESPN
      # scoreboard to prove the live path.
      - run: pnpm check:smoke
      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdx
