name: Deploy

# Refreshes the live snapshots from ESPN's keyless JSON and ships public/ to
# Cloudflare Workers static assets. Runs on every merge to main and once an
# hour, so standings, leaders, injuries and the power index stay current
# without a commit.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that is halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Hosted on purpose: the Cloudflare token stays off the PCs, and the site
    # must deploy even when every PC is off.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Either secret name works; the repo currently stores it as CLOUDFLARE_API_KEY.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Finished game days never change, so they ride along between runs.
      - uses: actions/cache@v4
        with:
          path: scripts/refresh/.cache
          key: season-games-${{ github.run_id }}
          restore-keys: season-games-

      # A feed that fails keeps its committed snapshot; the step only fails
      # when every feed is down, and then the committed data ships as is.
      - name: Refresh live snapshots
        continue-on-error: true
        run: pnpm refresh:live

      - name: Static integrity
        run: pnpm check:site

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@4.148.0 deploy

      - name: Cloudflare token missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. See docs/HOSTING.md."
